      - label: DevOps, CI/CD & Testing
        details: "CI/CD pipeline design; SDLC practices; Agile/Scrum collaboration; Docker containerization; automated testing (unit, integration, E2E); Git workflows; code review"

      - label: Data Engineering & Computer Vision
        details: "Scalable data pipelines; scientific data analysis; deep learning segmentation (PyTorch); algorithm optimization; large-scale imagery"

      - label: Domain Expertise
