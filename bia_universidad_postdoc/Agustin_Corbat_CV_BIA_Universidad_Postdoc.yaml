  sections:
    Resumen Profesional:
      - "**Doctor en Ciencias Físicas (PhD), con formación troncal en Medicina y experiencia en microscopía cuantitativa, visión por computadora e inteligencia artificial aplicada a flujos reproducibles.** Trabajo con equipos interdisciplinarios para convertir preguntas biológicas y clínicas en métricas robustas y análisis útiles para la toma de decisiones. Diseño y documento con Git flujos para imágenes 2D/3D y de gran escala (lámina completa, OME-Zarr), y capacito usuarios. **Participo activamente en LABI y GloBIAS, donde desarrollo y comparto materiales de formación abiertos y alineados con principios FAIR. En Karolinska Institutet y SciLifeLab adquirí experiencia articulando inversores, grupos de investigación y equipos interdisciplinarios para acordar objetivos comunes y alcanzarlos.**"

    Competencias Clave:
      - label: Análisis de bioimágenes
        details: "Segmentación clásica y con aprendizaje automático y profundo (Cellpose, StarDist, U-Net, SAM); extracción de características, morfometría, fenotipado cuantitativo, análisis espacial y control de calidad"
      - label: Modalidades y datos
        details: "Microscopía de fluorescencia de campo amplio y confocal, de lámina de luz e imágenes de lámina completa; resonancia magnética (MRI) y tomografía computada (CT); datos multiplex y series temporales"
      - label: Programación, arquitectura y reproducibilidad
        details: "Python (NumPy, pandas, scikit-image, scikit-learn, PyTorch), Jupyter, QuPath, Fiji y napari; diseño modular, principios SOLID, documentación técnica, ciclo de vida del desarrollo de software y colaboración con Git/GitHub"
      - label: Ingeniería de software e IA agéntica
        details: "Desarrollo guiado por pruebas, validación de flujos de trabajo, diseño de entornos de ejecución y contexto para agentes, y orquestación de herramientas para asistentes reproducibles"
      - label: Transferencia y soporte
        details: "Consultoría para equipos interdisciplinarios, definición de indicadores clave de desempeño (KPI) y mentoría"

    Experiencia Profesional Relevante:
      - company: Centro de Microscopías Avanzadas, Universidad de Buenos Aires
        position: Analista de bioimágenes
        date: 2024--actual
        location: Buenos Aires, Argentina
        highlights:
          - Desarrollo y soporte de flujos de análisis para diversas modalidades de microscopía, con foco en robustez, trazabilidad y mantenimiento
          - Asesoramiento en diseño experimental, métricas cuantitativas y estadística
          - Docencia en materias y diseño de cursos de análisis de bioimágenes

      - company: BioImage Informatics Facility (BIIF), SciLifeLab y NBIS
        position: Analista de bioimágenes
        date: 2024--2025
        location: Uppsala, Suecia
        highlights:
          - Consultoría técnica en proyectos biomédicos, tanto en investigación académica como en la industria
          - Implementación de flujos reproducibles con Python, napari, QuPath y Fiji, documentados para facilitar su mantenimiento y reutilización
          - Diseño de cursos y talleres de análisis de bioimágenes para posgrado

      - company: Karolinska Institutet
        position: Investigador posdoctoral en biología del desarrollo
        date: 2022--2024
        location: Estocolmo, Suecia
        highlights:
          - Cuantificación de imágenes de microscopía confocal y de whole slide para estudiar el destino celular
          - Diseño y validación de estrategias de análisis para responder hipótesis biológicas
          - "Distinciones y financiación: Sello de Excelencia de las Acciones Marie Skłodowska-Curie y apoyo del Consejo Sueco de Investigación (Vetenskapsrådet)"

    Proyectos Destacados:
      - name: "Perfilado espacial de la interacción huésped-patógeno en riñón (*Candida albicans*)"
        date: 2025
        location: BIIF, SciLifeLab
        highlights:
          - Flujo de análisis de inmunofluorescencia multiplex e imágenes de whole slide
          - Registro con elastix, uso de OME-Zarr para datos de gran escala y análisis espacial cuantitativo
          - "Proyecto: https://biifsweden.github.io/projects/2025/02/25/PerLjungdahl2025-1/"

      - name: Segmentación de malformaciones cavernosas en resonancia magnética (MRI) de cerebro de ratón
        date: 2024
        location: BIIF, SciLifeLab
        highlights:
          - Preprocesamiento de MRI, registro, segmentación asistida por aprendizaje automático y profundo, y validación de desempeño
          - "Proyecto: https://biifsweden.github.io/projects/2024/09/01/PeetraMagnusson2024-1/"

      - name: Fenotipado cuantitativo de macrófagos asociados a tumores (TAM) perivasculares en metástasis
        date: 2024
        location: BIIF, SciLifeLab
        highlights:
          - Flujo de análisis en QuPath y Groovy para anotación y medición escalables
          - Documentación y capacitación de usuarios para adopción efectiva
          - "Proyecto: https://biifsweden.github.io/projects/2024/07/10/CharlotteRolny2024-1/"

    Liderazgo y Comunidad Profesional:
