  sections:
    Resumen:
      - "He desarrollado un perfil multidisciplinario en física, biología y análisis cuantitativo, con base inicial en medicina y especialización en biofísica y estadística. Durante mi doctorado y en etapas posteriores, me enfoqué en microscopía, integrando trabajo experimental y modelado matemático para responder preguntas de investigación. En paralelo, sostengo una fuerte actividad docente en estadística, física, microscopía y análisis de imágenes. Actualmente me desempeño como analista de imágenes, brindando soporte en el desarrollo de secuencias de análisis y en la formación de usuarios. Además, contribuyo al desarrollo institucional global de la disciplina como miembro del Comité de Consejeros Científicos de GloBIAS (Global Bioimage Analysts Society). Más información y proyectos en mi [página web](https://acorbat.github.io)."

    Roles en Investigación y Análisis de Bioimágenes:
      - company: Instituto de Física de Buenos Aires, Universidad de Buenos Aires
        position: Postdoctorado y Jefe de Trabajos Prácticos, Dedicación Exclusiva
        date: 2025--actual
        location: Buenos Aires, Argentina
        highlights:
          - Investigación y docencia en física de sistemas biológicos, con foco en análisis cuantitativo de imágenes de microscopía

      - company: BioImage Informatics Facility (BIIF), SciLifeLab y National Bioinformatics Infrastructure Sweden (NBIS)
        position: Analista de bioimágenes
        date: 2024--2025
        location: Uppsala, Suecia
        highlights:
          - Consultoría técnica para proyectos biomédicos con flujos de análisis reproducibles
          - Implementación de pipelines con métodos clásicos y aprendizaje automático

      - company: Karolinska Institutet, Department of Cell and Molecular Biology
        position: Postdoctorado en biología del desarrollo
        date: 2022--2024
        location: Estocolmo, Suecia
        highlights:
          - Investigación en destino celular combinando microscopías avanzadas y modelado cuantitativo
          - Distinción Marie Sklodowska-Curie Seal of Excellence y financiamiento Vetenskapsrådet

