  sections:
    Resumen Profesional:
      - "Analista senior de bioimágenes con formación en Física (PhD) y base en Medicina, especializado en microscopía cuantitativa, visión por computadora e integración de IA en pipelines reproducibles. Trabajo junto a equipos interdisciplinarios para traducir preguntas biológicas y clínicas en métricas robustas, análisis estadístico accionable y reportes claros para toma de decisiones. Experiencia en consultoría técnica, diseño de workflows para imágenes 2D/3D y de gran escala (whole-slide, OME-Zarr), estandarización de procesos con Git y capacitación de usuarios en entornos académicos y core facilities."

    Competencias Clave:
      - label: Análisis de bioimágenes
        details: "Segmentación clásica, con machine learning y deep learning (Cellpose, StarDist, U-Net, SAM), extracción de features, morfometría, fenotipado cuantitativo, análisis espacial y control de calidad"
      - label: Modalidades y datos
        details: "Microscopía de fluorescencia widefield/confocal, light-sheet, whole-slide imaging, MRI/CT; flujos para datos multiplex y series temporales"
      - label: Programación, arquitectura y reproducibilidad
        details: "Python (NumPy, pandas, scikit-image, scikit-learn, PyTorch), Jupyter, QuPath, Fiji, Napari; diseño modular, principios SOLID, documentación técnica, SDLC y colaboración con Git/GitHub"
      - label: Ingeniería de software y Agentic AI
        details: "Test-driven development, validación de workflows, harness engineering para agentic AI, context engineering y orquestación de herramientas para asistentes reproducibles"
      - label: Transferencia y soporte
        details: "Consultoría para equipos interdisciplinarios, definición de KPIs y mentoring"

    Experiencia Profesional Relevante:
      - company: Centro de Microscopías Avanzadas, Universidad de Buenos Aires
        position: Analista de Bioimágenes
        date: 2024--actual
        location: Buenos Aires, Argentina
        highlights:
          - Desarrollo y soporte de pipelines para microscopía de distinto tipo con enfoque en robustez, trazabilidad y mantenimiento
          - Asesoramiento en diseño experimental, métricas cuantitativas y estadística
          - Docencia en materias y diseño de cursos de análisis de bioimágenes

      - company: BioImage Informatics Facility (BIIF), SciLifeLab y NBIS
        position: Analista de Bioimágenes
        date: 2024--2025
        location: Uppsala, Suecia
        highlights:
          - Consultoría técnica en proyectos biomédicos tanto de investigación académica como en industria
          - Implementación de pipelines reproducibles en Python, Napari, QuPath y Fiji para entrega sostenible y reutilizable
          - Diseño de cursos y talleres de análisis de bioimágenes para posgrado

      - company: Karolinska Institutet
        position: Investigador Postdoctoral en Biología del Desarrollo
        date: 2022--2024
        location: Estocolmo, Suecia
        highlights:
          - Cuantificación de datos de microscopía confocal y whole-slide para estudios de destino celular
          - Diseño y validación de estrategias de análisis para responder hipótesis biológicas
          - "Financiamiento y reconocimiento: Marie Sklodowska-Curie Seal of Excellence y Vetenskapsrådet"

    Proyectos Destacados en Bioimagen:
      - name: Spatial profiling de interacción huésped-patógeno en riñón (Candida albicans)
        date: 2025
        location: BIIF, SciLifeLab
        highlights:
          - Flujo de análisis para inmunofluorescencia multiplex y whole-slide imaging
          - Registro de imágenes con elastix, uso de OME-Zarr para gran escala y análisis espacial cuantitativo
          - "Proyecto: https://biifsweden.github.io/projects/2025/02/25/PerLjungdahl2025-1/"

      - name: Segmentación de malformaciones cavernosas en MRI de cerebro de ratón
        date: 2024
        location: BIIF, SciLifeLab
        highlights:
          - Preprocesamiento MRI, registro, segmentación asistida por ML/DL y validación de desempeño
          - "Proyecto: https://biifsweden.github.io/projects/2024/09/01/PeetraMagnusson2024-1/"

      - name: Fenotipado cuantitativo de TAM perivasculares en metástasis
        date: 2024
        location: BIIF, SciLifeLab
        highlights:
          - Pipeline en QuPath + Groovy para anotación y medición escalable
          - Documentación y capacitación de usuarios para adopción efectiva
          - "Proyecto: https://biifsweden.github.io/projects/2024/07/10/CharlotteRolny2024-1/"

