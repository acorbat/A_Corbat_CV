          - "Diseño de un flujo reproducible en QuPath y Groovy para clasificar células inmunes y tumorales, extraer métricas espaciales y relacionar fenotipo celular con proximidad vascular"
          - "Documentación de criterios, discusión de resultados con especialistas y capacitación de usuarios para facilitar la transferencia y reutilización del análisis"
