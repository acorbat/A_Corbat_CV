  sections:
    Resumen de trayectoria:
      - "**Doctor en Ciencias Físicas, con formación previa en Medicina y trayectoria interdisciplinaria en biofísica, microscopía, modelado matemático y análisis cuantitativo de imágenes**. Me especialicé en técnicas avanzadas de microscopía, combinando desarrollo experimental, modelado y análisis de datos. Diseñé y construí componentes a medida para ampliar las capacidades de los microscopios y participé en proyectos de instrumentación científica, incluyendo un prototipo de microscopio de fluorescencia miniaturizado y de bajo costo, dispositivos optomecánicos fabricados mediante impresión 3D y sistemas controlados con Arduino. Esta experiencia respalda la actualización del microscopio del proyecto, incorporando una cámara de alta velocidad y una cámara de control ambiental construida con impresión 3D y materiales de bajo costo."
      - "Durante los últimos años me desempeñé como analista de bioimágenes en instalaciones de soporte científico de Argentina y Suecia. **Interpreto las necesidades de usuarios de disciplinas diversas y las traduzco en decisiones técnicas**: qué observables biológicos extraer, cómo mejorar y hacer repetible la adquisición para obtener mediciones confiables y cómo diseñar flujos automatizados de análisis de imágenes. Esta experiencia es central para convertir las imágenes de microscopía en indicadores objetivos para el estudio de la disquinesia ciliar primaria."
      - "**En mi proceso de independización también dirigí grupos de estudiantes de Master y de grado avanzado en colaboración con equipos multidisciplinarios**. El proyecto requiere esta articulación entre médicos, que definirán las necesidades clínicas y biológicas, y estudiantes de Física y Ciencia de Datos, que participarán en la instrumentación, la programación y el análisis. Mi experiencia en investigación, desarrollo experimental, análisis de bioimágenes, supervisión y comunicación entre disciplinas proporciona una base sólida para coordinar estas tareas y ejecutar el proyecto de manera reproducible."

    Competencias técnicas:
      - label: Análisis de bioimágenes
        details: "Segmentación clásica y con machine learning/deep learning (Cellpose, StarDist, U-Net, SAM); extracción de features; morfometría; fenotipado cuantitativo; análisis espacial; análisis estadístico; control de calidad y análisis de series temporales"
      - label: Modalidades y datos
        details: "Microscopía de optica y de fluorescencia widefield y confocal; light-sheet; imágenes de campo claro; Resonancia Mágnetica Nuclear y Tomografía; Microscopía multiplex y secuencias temporales"
      - label: Programación, arquitectura y reproducibilidad
        details: "Fluente en Python (NumPy, pandas, scikit-image, scikit-learn, PyTorch); Jupyter; QuPath; Fiji; Napari; diseño modular de flujos; principios SOLID; documentación técnica; control de versiones y colaboración con Git/GitHub"
      - label: Ingeniería de software y automatización
        details: "Diseño de pipelines reproducibles; validación de workflows; integración entre adquisición, procesamiento y análisis; desarrollo orientado a la transferencia y mantenimiento por parte de equipos de investigación"
      - label: Instrumentación y desarrollo tecnológico
        details: "Diseño y construcción de componentes a medida para microscopía; actualización de sistemas de adquisición; dispositivos electromecánicos; impresión 3D; materiales de bajo costo; control con Arduino; integración entre hardware y software"
      - label: Transferencia y soporte científico
        details: "Consultoría para equipos interdisciplinarios; interpretación de necesidades experimentales; definición de observables y métricas; mejora y estandarización de la adquisición; mentoring, capacitación de usuarios y comunicación entre disciplinas"
    
