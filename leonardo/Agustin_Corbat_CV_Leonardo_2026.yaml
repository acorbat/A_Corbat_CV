    Proyectos de bioimagen y desarrollo:
      - name: Spatial Profiling of the renal host-pathogen interplay in response to Candida albicans infection in mice
        date: '2025'
        location: BioImage Informatics Facility, SciLifeLab y NBIS
        highlights:
          - "Trabajo en colaboración con un grupo de investigadores biomédicos que estudiaba la expresión celular en respuesta a una infección fúngica por Candida albicans en riñones de ratón"
          - "Combinación de imágenes de fluorescencia multiplex de escala gigapixel con información de expresión local de ARN, utilizando OME-Zarr, registro de imágenes y análisis espacial para obtener observables biológicos interpretables"
          - "Traducción de preguntas biológicas en métricas cuantitativas, selección de herramientas para datos de gran escala, diseño de un flujo reproducible y comunicación de resultados con un equipo interdisciplinario"
          - "Descripción: https://biifsweden.github.io/projects/2025/02/25/PerLjungdahl2025-1/"
      - name: Segmentation of cavernous malformations using MRI scans of mouse brain
        date: '2024'
        location: BioImage Informatics Facility, SciLifeLab y NBIS
        highlights:
          - "Trabajo con un grupo de biólogos y médicos que estudiaba el progreso o la regresión de malformaciones cavernosas en cerebros de ratones vivos, detectadas mediante resonancia magnética después de dos meses de tratamiento"
          - "Desarrollo de un flujo de preprocesamiento, registro y segmentación asistida por machine learning para comparar lesiones a lo largo del tiempo y generar mediciones longitudinales reproducibles"
          - "Integración de necesidades biológicas y clínicas en una estrategia de análisis validable, con comunicación técnica entre especialistas en imagen, biología y medicina"
