  sections:
    Summary:
      - "**Senior Data Scientist, Senior Image Analyst and AI Engineer** with a PhD in Physics and core training in Medicine, with a long-standing **passion for biomedical research** and a track record of leading end-to-end client projects from stakeholder meetings and requirement definition to technical implementation, validation, and delivery of actionable results; strong profile in **statistical analysis, machine learning, and computer vision** across microscopy, MRI, CT, digital pathology, and digital petrography; advanced programming expertise with **software architecture**, **SOLID principles**, and collaborative **Git/GitHub workflows**; substantial experience in **teaching, mentoring, and supervising students and technical projects**; and delving into hands-on implementation of **Agentic AI** solutions, including agent skill development, tool orchestration, and **Model Context Protocol (MCP)**-oriented integrations to build production-ready, robust, and user-friendly pipelines suitable for downstream publication and reuse."

    Technical Skills:
      - label: Data Science & Statistics
        details: "EDA; hypothesis testing; statistical modeling; feature engineering; model evaluation/validation; uncertainty-aware analysis; data visualization and reporting for decision support"

      - label: Programming, Architecture & Collaboration
        details: "Expert Python (NumPy, pandas, scikit-learn, scikit-image, matplotlib, seaborn); reproducible pipeline design; software architecture; programming formalisms; SOLID principles; Agile development; test-driven development; Git/GitHub collaboration; code review; technical documentation"

      - label: Machine Learning & Computer Vision
        details: "Machine learning and deep learning with PyTorch; segmentation/classification workflows; SAM (Vision Transformer), U-Net, Cellpose, StarDist; object-level quantification, morphometrics, and spatial analysis"

      - label: Biomedical & Clinical Imaging Data
        details: "Quantitative image and data analysis workflows for microscopy, MRI, CT, and digital pathology; 2D/3D processing; large-image handling (whole-slide and OME-Zarr)"

      - label: Agentic AI & MCP
        details: "Design and implementation of agent skills and assistant workflows; context engineering; tool orchestration for analysis automation; MCP concepts and integration patterns"

      - label: Tools & Languages
        details: "Jupyter, Napari, Fiji, QuPath, MATLAB; Spanish (native), English (fluent), French (beginner)"

