        area: Physics
        degree: PhD
        start_date: 2016-04
        end_date: 2021-10
        location: Buenos Aires, Argentina
      - institution: Universidad de Buenos Aires, Facultad de Ciencias Exactas y Naturales
        area: Physics
        degree: Licenciatura
        start_date: 2011-01
        end_date: 2016-12
        location: Buenos Aires, Argentina

