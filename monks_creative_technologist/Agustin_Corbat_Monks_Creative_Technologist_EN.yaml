  sections:
    Summary:
      - "Creative Technologist and Senior Data/Bioimage Analyst (PhD in Physics, core training in Medicine) with strong creative thinking, technical depth, and physicist-style problem solving for complex real-world challenges. I design production-minded pipelines across microscopy, MRI, CT, digital pathology, and large-scale image datasets using Python, computer vision, and deep learning, with emphasis on software architecture, SOLID principles, collaborative Git workflows, and Agentic AI approaches. As a bioimage analyst, I work at the intersection of computer science, physics, and biology, and collaborate closely with experts from biology, geology, and medicine while leading projects end-to-end, including direct client communication. I also regularly present my own work and facility-driven work at conferences and technical meetings. As a physicist trained in Argentina, I frequently tinker with equipment and build custom prototypes/adaptations to improve experimental systems; a concrete example is the open-source fast filter wheel prototype developed for optics workflows, which earned 2nd prize at the national INNOVAR competition."

    Core Skills:
      - label: Creative Technology and Prototyping
        details: "Rapid prototyping for imaging workflows, instrumentation adaptation, experimental setup optimization, technical translation between scientific and engineering teams"
      - label: Agentic AI Prototyping
        details: "Use Agentic AI to develop fast prototypes, orchestrate tools, and iterate quickly from concept to usable technical solutions"
      - label: LLM and Prompt Engineering
        details: "Hands-on experience with LLM-assisted workflows, prompt engineering, evaluation and iterative refinement for reliable outcomes"
      - label: Python and Data
        details: "Python (NumPy, pandas, scikit-image, scikit-learn, matplotlib, seaborn), reproducible analysis pipelines, data wrangling, statistics, visualization, software architecture, SOLID principles"
      - label: Computer Vision and AI
        details: "Classical image processing, segmentation and quantification, PyTorch, deep learning foundations (CNNs, Transformers), SAM (Segment Anything Model, Vision Transformer), Cellpose, Agentic AI workflow design, context engineering"
      - label: Imaging and Tools
        details: "Microscopy (confocal, light sheet, multiplex), MRI/CT analysis, digital pathology, QuPath, Fiji/ImageJ, Napari, Jupyter, Git/GitHub (branching, review, collaborative delivery)"

    Professional Experience:
