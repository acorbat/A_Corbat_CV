        highlights:
          - Design and implement end-to-end image analysis workflows for diverse microscopy datasets
          - Lead interdisciplinary projects with experts in biology, geology, and medicine, including direct client-facing communication from scoping to delivery
          - Improve maintainability through modular software design, clear interfaces, and documented handover

