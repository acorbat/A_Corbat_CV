    Summary:
      - "**AI Engineer and Senior Python Developer** with a PhD in Physics and core training in Medicine, experienced in owning **end-to-end production workflows**: stakeholder discovery, requirement definition, architecture, implementation, validation, and handover. Strong foundation in **software engineering fundamentals** (data modeling, system design, test-driven development, SDLC, collaborative Git/GitHub workflows), plus hands-on work with **LLM-enabled tools and agentic workflows** for real-world analysis automation. Comfortable operating in **early-stage, ambiguous environments** where patterns are still emerging, while communicating clearly with both technical and non-technical stakeholders."

    Technical Skills:
      - label: Python and AI Engineering
        details: "Fluent Python (NumPy, pandas, scikit-learn, scikit-image, PyTorch); production-grade data and image pipelines; reproducible analysis systems; software architecture and modular design"

      - label: Software Engineering Fundamentals
        details: "System design; data modeling concepts; SDLC; test-driven development; maintainable codebases; documentation; code review; Git/GitHub collaboration and version control; containerized development with Docker; reproducible environment management with Pixi"

      - label: LLMs and Agentic Workflows
        details: "Daily hands-on use of AI-assisted development tools (GitHub Copilot in VS Code, Gemini CLI, pi and related harnesses); prompt design and iterative evaluation; multi-step LLM workflow experimentation with LangChain and LangGraph; context engineering and tool orchestration"

      - label: Data Platforms and Cloud Exposure
        details: "Familiarity with relational and non-relational data stores, schema design, and data lifecycle considerations; exposure to enterprise platforms such as Nextflow and Snowflake (or equivalent data pipeline/data warehouse tools); exposure to Google AI and Google Cloud services"

      - label: Computer Vision and Applied ML
        details: "Classical and deep learning segmentation/classification (SAM, U-Net, Cellpose, StarDist); feature extraction and quantitative analytics; heterogeneous biomedical imaging datasets"

      - label: Communication and Languages
        details: "Clear communication across technical and non-technical audiences; English (fluent), Spanish (native), French (beginner)"

