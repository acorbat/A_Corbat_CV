    Perfil Académico:
      - "Agustín Corbat es **Doctor en Ciencias Físicas** por la Universidad de Buenos Aires (2021) y Jefe de Trabajos Prácticos con dedicación exclusiva en la FCEN-UBA. Su trayectoria se inició con un trabajo doctoral en microscopía y análisis de bioimágenes y continuó, en Argentina y Suecia, con el diseño y análisis de experimentos con bioimágenes de diversa índole: microscopías variadas y multidimensionales, resonancia magnética nuclear e imágenes de cámaras. Desarrolló material de enseñanza en Estocolmo para múltiples instituciones, entre ellas el **Karolinska Institutet** y la **Swedish University of Agricultural Sciences (SLU)**, y diseñó o dictó cursos en **Universidad Mayor (Chile)**, **KhipuX (Ecuador)**, **Instituto Pasteur (Uruguay)** y la **Universidad de Buenos Aires (Argentina)**. Articula de manera sostenida biología, física, computación y ciencia de datos, e integra el Comité de Consejeros Científicos de GloBIAS (Global BioImage Analysts' Society). Su incorporación a +Visitantes permitiría fortalecer la formación de estudiantes y los proyectos de investigación aplicados a imágenes."

