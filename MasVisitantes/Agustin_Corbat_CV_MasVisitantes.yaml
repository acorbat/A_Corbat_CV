    Aporte Esperado para +Visitantes:
      - bullet: Fortalecer la formación de estudiantes de grado y posgrado mediante cursos y talleres prácticos de análisis de bioimágenes, con material abierto y reutilizable.
      - bullet: Impulsar proyectos de investigación aplicados a imágenes que articulen biología, física, computación y ciencia de datos.
      - bullet: Vincular a la comunidad de la UBA con redes internacionales de análisis de bioimágenes, como GloBIAS y LABI.
      - bullet: Promover el rol del analista de bioimágenes como perfil profesional consolidado, con formación específica y desarrollo de carrera.

