  sections:
    Summary:
      - "**Advanced Data Scientist with a PhD in Physics and foundational training in Medicine**, with a background spanning data science and quantitative image analysis, combining rigorous statistical expertise with hands-on machine learning and client-facing consulting experience in healthcare and life sciences. Proven ability to develop statistically sound, high-dimensionality algorithms and predictive models that translate complex biomedical data into actionable insights. Track record of delivering scalable analytical solutions for academic institutions and biotechnology companies, leading projects end-to-end from stakeholder scoping through implementation and validation. Experienced in mentoring junior team members and communicating technical results to multidisciplinary audiences."

    Technical Skills:
      - label: Statistics & Predictive Modeling
        details: "Hypothesis testing; regression and classification modeling; predictive modeling; EDA; feature engineering and selection; model evaluation and validation; uncertainty quantification; time series analysis; data visualization for decision support"

      - label: Machine Learning & AI Algorithms
        details: "Supervised/unsupervised learning (scikit-learn); deep learning with PyTorch; segmentation and classification pipelines (U-Net, SAM, Cellpose, StarDist); dimensionality reduction; spatial and morphometric analysis; data mining and pattern recognition; agentic AI coding workflows"

      - label: Programming & Data Engineering
        details: "Advanced Python (NumPy, pandas, scikit-image, scikit-learn, matplotlib, seaborn); software architecture; SOLID principles; code review; reproducible pipeline design with Git/GitHub; Programming Formalisms; SQL (fundamentals); cloud environments (AWS and Azure fundamentals); Agile development practices; Jupyter; Napari; MATLAB; AI agent skills; tool orchestration; Model Context Protocol (MCP) concepts and integrations"

      - label: Domain Knowledge
        details: "Healthcare and life sciences (imaging biomarkers, histopathology, MRI, clinical and preclinical data); medical consulting background; Spanish (native), English (fluent — First Certificate, IGCSE)"

    Professional Experience:
      - company: Centro de Microscopias Avanzadas, Universidad de Buenos Aires
