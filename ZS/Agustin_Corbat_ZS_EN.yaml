        start_date: 2024-09
        end_date: present
        location: Buenos Aires, Argentina
        highlights:
          - "Design and deploy custom algorithms and analytical workflows to solve high-dimensionality problems from complex biomedical datasets for academic and clinical stakeholders"
          - "Lead complete project lifecycles: requirement scoping, quantitative solution design, statistical validation, and delivery of reproducible, maintainable pipelines"
          - "Mentor undergraduate and graduate students; deliver training workshops on machine learning, deep learning, and quantitative analysis for diverse scientific audiences"

      - company: BioImage Informatics Facility (BIIF), SciLifeLab / Uppsala University
        position: Bioimage Analyst & Data Science Consultant
        start_date: 2024-04
        end_date: 2025-05
        location: Uppsala, Sweden
        highlights:
          - "Delivered client-facing data science consulting across 8+ independent biomedical projects, owning stakeholder communication, technical strategy, and solution delivery from start to finish"
          - "Developed reusable, well-documented machine learning and deep learning pipelines (Python, PyTorch, scikit-learn) for segmentation, classification, and spatial analysis of heterogeneous healthcare imaging datasets; supported handover for long-term team use"
          - "Applied statistical data mining and pattern recognition to extract clinically relevant quantitative metrics from large-scale fluorescence microscopy and MRI datasets"
          - "Consulted directly with biotechnology/diagnostics companies (Bohus Biotech, Navinci) to define quantitative algorithms, quality metrics, and scalable analysis frameworks"

